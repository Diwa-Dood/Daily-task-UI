<div class="chat-window" #scroll>
  <div class="message-group" *ngFor="let msg of messages$ | async" [ngClass]="msg.type">
    <div class="bubble-container">
      <div class="avatar" *ngIf="msg.type === 'ai'">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 7v4"></path>
          <line x1="8" y1="16" x2="8" y2="16"></line>
          <line x1="16" y1="16" x2="16" y2="16"></line>
        </svg>
      </div>
      <div class="bubble">
        <span class="text" [innerHTML]="msg.text"></span>

        <!-- Quick Action Buttons (only for AI greeting message, before tasks are added) -->
        <div class="actions-wrapper" *ngIf="msg.showButtons && !msg.isCheckedOut" style="display: block !important;">
          <div class="button-row">
            <button class="pill gray" (click)="onMeetingClick()">Meeting</button>
            <button class="pill gray" (click)="onClientCallClick()">Client Call</button>
            <button class="pill green" (click)="onAddNewTaskClick()">+ Add New Task</button>
          </div>
        </div>

        <!-- Submitted tasks summary in chat — rendered from real task data -->
        <ng-container *ngIf="msg.tasks && msg.tasks.length > 0">
          <div class="task-submitted-summary">
            <div class="task-list-header">
              <h3>Logged Tasks ({{ msg.tasks.length }})</h3>
            </div>
            <div class="task-summary-row" *ngFor="let task of msg.tasks; let i = index">
              <span class="task-index">#{{ i + 1 }}</span>
              <span class="task-type-badge">{{ task.type || 'Task' }}</span>
              <span class="task-desc">{{ task.description }}</span>
              <span class="task-time" *ngIf="task.hours">
                {{ task.hours | timeFormat }}
              </span>
              <button class="edit-task-btn" title="Edit this task" (click)="onEditTask(msg, task, i)">
                ✏️ Edit
              </button>
            </div>
          </div>
        </ng-container>

      </div>
    </div>
    <div class="timestamp" *ngIf="msg.timestamp">
      {{ msg.timestamp | date:'shortTime' }}
    </div>
  </div>
</div>
