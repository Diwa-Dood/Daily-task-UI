<div class="input-container">
  <div class="input-wrapper shadow-md">
    <button class="mic_btn" [class.listening]="listening" (click)="toggleListening()" [disabled]="loading"
      title="Voice Input">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>

    <input [(ngModel)]="message" (keyup.enter)="send()" [disabled]="loading"
      placeholder="Tell me what you worked on today..." />

    <button class="send_btn" (click)="send()" [disabled]="loading || !message.trim()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <div class="typing-indicator" *ngIf="loading">

    <span class="dot"></span>
    <span class="dot"></span>
    AI is organizing your tasks...
  </div> 
-->
</div>
