<div class="sidebar" [class.collapsed]="isCollapsed">
  <div class="logo" (click)="toggleCollapse()" [attr.title]="isCollapsed ? 'Expand Dashboard' : ''">
    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
      <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
    </svg>
    <span class="logo-text" *ngIf="!isCollapsed">Enterprise Log</span>
  </div>

  <div class="nav-items">
    <a class="nav-item" routerLink="/chat" routerLinkActive="active" [attr.title]="isCollapsed ? 'Today' : ''">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span class="nav-text" *ngIf="!isCollapsed">Today</span>
    </a>
    <a class="nav-item" routerLink="/history" routerLinkActive="active" [attr.title]="isCollapsed ? 'History' : ''">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <span class="nav-text" *ngIf="!isCollapsed">History</span>
    </a>
    <a class="nav-item" routerLink="/reports" routerLinkActive="active" [attr.title]="isCollapsed ? 'Reports' : ''">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span class="nav-text" *ngIf="!isCollapsed">Reports</span>
    </a>
  </div>

  <div class="sidebar-footer">
    <div class="user-info" (click)="toggleCollapse()" [attr.title]="isCollapsed ? (userName$ | async) : ''">
      <div class="avatar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="details" *ngIf="!isCollapsed">
        <div class="user-meta">
          <div class="name">{{ userName$ | async }}</div>
          <div class="role">Enterprise Plan</div>
        </div>
        <button class="logout-btn" (click)="logout(); $event.stopPropagation()" title="Logout">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
